{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDELYX — Factura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/factura.css' %}">
</head>
<body>

<div class="factura">

  <!-- Ribbon superior: INVOICE + logo -->
  <div class="ribbon">
    <span class="ribbon-tag">Invoice</span>
    <div class="logo-box">EX</div>
  </div>

  <!-- Marca -->
  <div class="brand">
    <h1>EDELYX</h1>
    <p>Factura de servicios</p>
  </div>

  <!-- N° Factura / Emisor / Factura para -->
  <div class="meta">
    <div class="folio-block">
      <label>N° de factura</label>
      <div class="folio-number">
        <input class="value" type="text" id="folio" value="0042" />
        <div class="barcode" id="barcode"></div>
      </div>
      <div class="field" style="margin-top:0.6rem;">
        <label>Fecha</label>
        <input type="text" id="fecha" placeholder="DD / MM / AAAA" />
      </div>
    </div>

    <div class="field-group">
      <div class="field">
        <label>Emisor</label>
        <input type="text" id="emisor" placeholder="Nombre del emisor" />
      </div>
      <div class="field">
        <label>Factura para</label>
        <input type="text" id="cliente" placeholder="Nombre del cliente" />
      </div>
    </div>
  </div>

  <!-- Resumen: tabla de artículos -->
  <div class="resumen">
    <div class="resumen-head">
      <h2>Resumen</h2>
      <span id="itemCount">3 artículos</span>
    </div>
    <table class="items">
      <thead>
        <tr>
          <th>Artículo</th>
          <th class="col-qty">Cantidad</th>
          <th class="col-price">Precio unitario</th>
          <th class="col-sub">Subtotal</th>
        </tr>
      </thead>
      <tbody id="itemsBody">
      </tbody>
    </table>
  </div>

  <!-- Términos y totales -->
  <div class="lower">
    <div class="terminos">
      <h3>Términos y condiciones</h3>
      <textarea id="terminos" placeholder="El pago debe realizarse dentro de los 15 días posteriores a la emisión de esta factura...">El pago debe realizarse dentro de los 15 días posteriores a la emisión de esta factura. Los pagos tardíos podrán generar un recargo del 2% mensual.</textarea>
    </div>

    <div class="totales">
      <div class="tax-inputs">
        <div class="field">
          <label>Impuesto (%)</label>
          <input type="number" id="taxRate" value="16" min="0" step="0.01" />
        </div>
        <div class="field">
          <label>Descuento ($)</label>
          <input type="number" id="discount" value="0" min="0" step="0.01" />
        </div>
      </div>

      <div class="totales-list">
        <div class="totales-row">
          <span class="label">Subtotal</span>
          <span class="amount" id="subtotalOut">$0.00</span>
        </div>
        <div class="totales-row">
          <span class="label">Impuesto</span>
          <span class="amount" id="taxOut">$0.00</span>
        </div>
        <div class="totales-row">
          <span class="label">Descuento</span>
          <span class="amount" id="discountOut">$0.00</span>
        </div>
        <div class="totales-row total">
          <span class="label">Total <span class="chev">&lt;&lt;&lt;</span></span>
          <span class="amount" id="totalOut">$0.00</span>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
